[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oria-engine"
version = "0.1.0"
description = "Application runtime for the Oria AI astrology personality"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "alembic>=1.16,<2",
    "cryptography>=45,<47",
    "dramatiq[redis]>=1.18,<3",
    "fastapi>=0.116,<1",
    "fastmcp>=2.12,<4",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "redis>=6.4,<8",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oria_engine", "services/astrology_mcp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "services"]
