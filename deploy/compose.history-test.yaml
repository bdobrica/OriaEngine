# OCH4 disposable provider dependencies; owned only by the random test project.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secondcontext
      POSTGRES_DB: secondcontext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generated by the test harness}
    ports: ["127.0.0.1:0:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U secondcontext -d secondcontext"]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports: ["127.0.0.1:0:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
