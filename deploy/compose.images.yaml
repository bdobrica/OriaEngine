# Oria-owned services; compose.secondcontext.yaml adds the bundled HTTP provider.
x-application: &application
  image: ${ORIA_APP_IMAGE:?Set ORIA_APP_IMAGE to a published version or digest}
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  stop_grace_period: 90s
  networks: [storage, egress]

x-environment: &environment
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://oria:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD}}@postgres:5432/oria
  REDIS_URL: redis://redis:6379/0
  ASTROLOGY_MCP_URL: http://astrology-mcp:8000/mcp
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET}
  TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:?Set the public HTTPS webhook origin}
  PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:?Set a stable PROFILE_ENCRYPTION_KEY}
  PROFILE_ENCRYPTION_KEY_VERSION: ${PROFILE_ENCRYPTION_KEY_VERSION:-v1}
  ORIA_POLICY_VERSION: ${ORIA_POLICY_VERSION:-2026-10-03.2}
  SECOND_CONTEXT_BASE_URL: ${SECOND_CONTEXT_BASE_URL:-http://secondcontext:8080}
  SECOND_CONTEXT_BEARER_TOKEN: ${SECOND_CONTEXT_BEARER_TOKEN:?Set the scoped SecondContext service token}
  SECOND_CONTEXT_SUBJECT_NAMESPACE: oria
  INBOUND_RATE_PER_MINUTE: ${INBOUND_RATE_PER_MINUTE:-20}
  QUEUED_JOBS_PER_USER: ${QUEUED_JOBS_PER_USER:-8}
  LLM_PROCESSING_ENABLED: ${LLM_PROCESSING_ENABLED:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [storage]
    environment:
      POSTGRES_USER: oria
      POSTGRES_DB: oria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oria -d oria"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [storage]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  astrology-mcp:
    image: ${ORIA_ASTROLOGY_IMAGE:?Set ORIA_ASTROLOGY_IMAGE to a published version or digest}
    restart: unless-stopped
    networks: [astrology]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  migrate:
    <<: *application
    restart: "no"
    networks: [storage]
    command: ["python", "-m", "alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    environment:
      # The storage-only CLI does not serve HTTP or require integration secrets.
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://oria:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD}}@postgres:5432/oria
    depends_on:
      postgres:
        condition: service_healthy
  gateway:
    <<: *application
    environment: *environment
    ports: ["127.0.0.1:${GATEWAY_PORT:-8001}:8001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    <<: *application
    stop_grace_period: 150s
    environment: *environment
    networks: [storage, astrology, egress]
    command: ["python", "-m", "oria_engine.queue", "--health-file", "/tmp/oria-worker.health"]
    healthcheck:
      test: ["CMD", "python", "-m", "oria_engine.container_health", "worker"]
      interval: 10s
      timeout: 8s
      start_period: 15s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      astrology-mcp:
        condition: service_healthy
volumes:
  postgres_data:
networks:
  storage:
    internal: true
  astrology:
    internal: true
  egress: {}
