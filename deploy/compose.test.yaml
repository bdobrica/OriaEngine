# Disposable test dependencies; no .env, fixed ports or operator volumes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oria
      POSTGRES_DB: oria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generated by the test harness}
    ports: ["127.0.0.1:0:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oria -d oria"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:0:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  astrology-mcp:
    profiles: ["astrology"]
    build:
      context: ..
      dockerfile: services/astrology_mcp/Dockerfile
    ports: ["127.0.0.1:0:8000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
